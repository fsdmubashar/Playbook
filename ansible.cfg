[defaults]
# Disable fact gathering globally (we enable it explicitly where needed)
gathering = explicit
# Use free strategy for parallel task execution on single host
strategy = free
# Reduce SSH connection overhead
forks = 10
# Callback for timing visibility
callbacks_enabled = timer, profile_tasks
stdout_callback = yaml

[ssh_connection]
# SSH Pipelining — biggest single speed improvement
pipelining = True
# Reuse SSH connections (ControlMaster)
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o PreferUserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no
# Control path in /tmp avoids socket length limit and permission issues in some cloud envs
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
# Faster file transfer
transfer_method = piped
# Reduce retries
retries = 2

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False
