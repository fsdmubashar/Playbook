---
# =============================================================================
# Global Default Variables
# master_deploy.yml ki vars section inhe override karti hai runtime par
# =============================================================================

default_php_version:    "8.2"
default_redis_host:     "127.0.0.1"
default_redis_port:     "6379"
nginx_user:             "www-data"

# MariaDB config
mysql_login_unix_socket: "/var/run/mysqld/mysqld.sock"
sql_cleanup_after_import: true

# ── Environment ──
stack_type: "php"

# ── Golden Copy Backup Server ──
backup_server_host: ""          # IP/hostname of the backup server
backup_server_user: "root"
backup_server_key_path: "~/.ssh/id_rsa"
remote_backup_path: ""          # Full path to .sql file on backup server

# ── Git / Bitbucket ──
git_ssh_key: "~/.ssh/id_rsa"

# ── PHP Extensions ──
php_extensions:
  - common
  - mysql
  - xml
  - xmlrpc
  - curl
  - gd
  - cli
  - dev
  - imap
  - mbstring
  - opcache
  - soap
  - zip
  - redis
  - intl
  - bcmath

