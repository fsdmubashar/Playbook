---
# Task 10: .env configure
# Fresh  → .env.example se copy + update
# Reconfig → Existing .env update (lineinfile)

- name: "Env | Check if .env already exists"
  stat:
    path: "{{ deploy_path }}/.env"
  register: existing_env

- name: "Env | .env.example check"
  stat:
    path: "{{ deploy_path }}/.env.example"
  register: env_example_stat
  when: not existing_env.stat.exists

- name: "Env | Copy .env.example"
  copy:
    src: "{{ deploy_path }}/.env.example"
    dest: "{{ deploy_path }}/.env"
    owner: "{{ app_name }}"
    group: www-data
    mode: "0640"
    remote_src: yes
    force: no
  when:
    - not existing_env.stat.exists
    - env_example_stat.stat is defined
    - env_example_stat.stat.exists

- name: "Env | Blank .env create (agar .example nahi)"
  file:
    path: "{{ deploy_path }}/.env"
    state: touch
    owner: "{{ app_name }}"
    group: www-data
    mode: "0640"
  when:
    - not existing_env.stat.exists
    - env_example_stat.stat is defined
    - not env_example_stat.stat.exists

- name: "Env | Variables set/update"
  lineinfile:
    path: "{{ deploy_path }}/.env"
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value | default(item.default_value, true) }}"
    create: yes
    owner: "{{ app_name }}"
    group: www-data
    mode: "0640"
  loop:
    - { key: "APP_NAME",        value: "{{ app_name | default('') }}",        default_value: "laravel_app" }
    - { key: "APP_URL",         value: "https://{{ app_domain | default('') }}", default_value: "http://localhost" }
    - { key: "APP_ENV",         value: "{{ app_env | default('') }}",         default_value: "production" }
    - { key: "APP_DEBUG",       value: "false",                               default_value: "false" }
    - { key: "DB_CONNECTION",   value: "mysql",                               default_value: "mysql" }
    - { key: "DB_HOST",         value: "{{ db_host | default('') }}",         default_value: "127.0.0.1" }
    - { key: "DB_PORT",         value: "3306",                                default_value: "3306" }
    - { key: "DB_DATABASE",     value: "{{ db_name | default('') }}",         default_value: "laravel" }
    - { key: "DB_USERNAME",     value: "{{ db_user | default('') }}",         default_value: "root" }
    - { key: "DB_PASSWORD",     value: "{{ db_password | default('') }}",     default_value: "" }
    - { key: "REDIS_HOST",      value: "{{ redis_host | default('') }}",      default_value: "127.0.0.1" }
    - { key: "REDIS_PORT",      value: "{{ redis_port | default('') }}",      default_value: "6379" }
    - { key: "CACHE_DRIVER",    value: "redis",                               default_value: "redis" }
    - { key: "SESSION_DRIVER",  value: "redis",                               default_value: "redis" }
    - { key: "QUEUE_CONNECTION", value: "redis",                              default_value: "redis" }

- name: "Env | Permissions confirm"
  file:
    path: "{{ deploy_path }}/.env"
    owner: "{{ app_name }}"
    group: www-data
    mode: "0640"

- name: "Env | Done"
  debug:
    msg: ".env configured at {{ deploy_path }}/.env"
