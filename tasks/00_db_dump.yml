---
# =============================================================================
# TASK: 00_db_dump.yml
# Purpose: SIRF us application ki specific DB ka dump lo
#
# IMPORTANT:
# - Puri MariaDB ka backup NAHI lena
# - Sirf dump_db_name wali database ka dump hoga
# - Purane server ke creds use honge (dump_db_user / dump_db_password)
#
# FLOW:
#   1. Purane server par SSH → sirf {{ dump_db_name }} ka mysqldump
#   2. db_direct_access = yes → Purana server → Naya server direct rsync
#      db_direct_access = no  → Purana server → ThinkPad → Naya server
#   3. sql_dump_path fact set karo (09_database_restore.yml import karega)
# =============================================================================

# ── Step 1: Connectivity check ──────────────────────────────────────────────

- name: "Dump | Purana server reachable hai?"
  wait_for:
    host: "{{ dump_db_server_ip }}"
    port: 22
    timeout: 15
    msg: "Purana server {{ dump_db_server_ip }} port 22 par reachable nahi - SSH check karo"
  delegate_to: localhost
  become: no

- name: "Dump | Info - kya dump hoga"
  debug:
    msg:
      - "Purana Server : {{ dump_db_server_ip }}"
      - "Sirf DB       : {{ dump_db_name }}"
      - "DB User       : {{ dump_db_user }}"
      - "Puri MariaDB  : NAHI - sirf yeh ek database"

# ── Step 2: Sirf us application ki DB ka dump lo ────────────────────────────

- name: "Dump | Purane server par mysqldump chalao (sirf {{ dump_db_name }})"
  shell: |
    DUMP_FILE="/tmp/{{ app_name }}_dump_$(date +%Y%m%d_%H%M%S).sql"

    # Sirf {{ dump_db_name }} database ka dump - no --all-databases
    # MYSQL_PWD environment se password pass kiya ja raha hai.
    # sql_dump_merge_mode: --no-create-info (pair with sql_import_merge_mode on target)
    ARGS=( -u "{{ dump_db_user }}" --single-transaction --routines --triggers )
    if [ "{{ use_no_create_info | int }}" = "1" ]; then
      ARGS+=( --no-create-info )
    fi
    mysqldump "${ARGS[@]}" "{{ dump_db_name }}" > "${DUMP_FILE}"
  vars:
    use_no_create_info: "{{ 1 if (sql_dump_merge_mode | default(false) | bool) else 0 }}"

    # Check ke dump file empty toh nahi
    if [ ! -s "${DUMP_FILE}" ]; then
      echo "ERROR: Dump file empty hai - DB name ya credentials check karo"
      exit 1
    fi

    echo "${DUMP_FILE}"
  delegate_to: "{{ dump_db_server_ip }}"
  vars:
    ansible_user: "{{ dump_db_server_user }}"
    ansible_ssh_private_key_file: "{{ dump_db_server_key }}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
  environment:
    MYSQL_PWD: "{{ dump_db_password }}"
  become: no
  register: dump_result

- name: "Dump | Fail reason show karo (mysqldump)"
  fail:
    msg: |
      Purane server par mysqldump fail hua.
      RC: {{ dump_result.rc }}
      STDERR:
      {{ dump_result.stderr | default('No stderr output') }}
  when: dump_result.rc != 0

- name: "Dump | Dump file path"
  set_fact:
    remote_dump_path: "{{ dump_result.stdout | trim }}"

- name: "Dump | Dump complete"
  debug:
    msg: "Dump ready on purana server: {{ remote_dump_path }}"

# ── Step 3: Purana → ThinkPad → Naya ────────────────────────────────────────

- name: "Dump | Purana server → Local ThinkPad"
  shell: |
    rsync -avz \
      -e "ssh -o StrictHostKeyChecking=no -i {{ dump_db_server_key }}" \
      "{{ dump_db_server_user }}@{{ dump_db_server_ip }}:{{ remote_dump_path }}" \
      "/tmp/{{ app_name }}_restore.sql"
  delegate_to: localhost
  become: no
  when: true

- name: "Dump | Local ThinkPad → Naya deploy server"
  copy:
    src: "/tmp/{{ app_name }}_restore.sql"
    dest: "/tmp/{{ app_name }}_restore.sql"
    mode: "0644"
  when: true

- name: "Dump | Transfer complete (Purana → ThinkPad → Naya)"
  debug:
    msg: "Purana server → ThinkPad → Naya server done"
  when: true

# ── Step 4: sql_dump_path set karo ──────────────────────────────────────────

- name: "Dump | sql_dump_path fact set karo"
  set_fact:
    sql_dump_path: "/tmp/{{ app_name }}_restore.sql"

- name: "Dump | Dump file verify karo naye server par"
  stat:
    path: "/tmp/{{ app_name }}_restore.sql"
  register: dump_on_deploy

- name: "Dump | Verify result"
  debug:
    msg:
      - "Dump file   : /tmp/{{ app_name }}_restore.sql"
      - "Size        : {{ (dump_on_deploy.stat.size / 1024 / 1024) | round(2) }} MB"
      - "Status      : Ready - 09_database_restore.yml import karega"
  when: dump_on_deploy.stat.exists

- name: "Dump | FAIL - Dump file naye server par nahi mila"
  fail:
    msg: |
      Dump file deploy server par nahi pahunchi.
      Check karo:
        - Purana server {{ dump_db_server_ip }} accessible hai?
        - Database '{{ dump_db_name }}' exist karta hai?
        - DB credentials sahi hain?
  when: not dump_on_deploy.stat.exists

# ── Cleanup ──────────────────────────────────────────────────────────────────

- name: "Dump | Cleanup - Purane server ka temp dump delete"
  file:
    path: "{{ remote_dump_path }}"
    state: absent
  delegate_to: "{{ dump_db_server_ip }}"
  vars:
    ansible_user: "{{ dump_db_server_user }}"
    ansible_ssh_private_key_file: "{{ dump_db_server_key }}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
  become: no
  ignore_errors: yes

- name: "Dump | Cleanup - ThinkPad ka local temp dump delete"
  file:
    path: "/tmp/{{ app_name }}_restore.sql"
    state: absent
  delegate_to: localhost
  become: no
  when: true
  ignore_errors: yes
