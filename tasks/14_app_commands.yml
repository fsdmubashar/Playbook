---
# =============================================================================
# Task 14: App-specific commands
#
# STRICT RULES:
# 1. PHP/Composer/Artisan → NEVER as root
# 2. ALWAYS as {{ app_name }} user
# 3. Absolute binary paths (/usr/bin/php, /usr/local/bin/composer)
# 4. HOME env = /home/{{ app_name }} explicitly set
# 5. COMPOSER_HOME = /home/{{ app_name }}/.composer
# 6. app_name user 07_app_user.yml mein sahi ownership le chuka hai
# =============================================================================

- name: "PHP | composer install"
  command: >
    /usr/local/bin/composer install
    --no-dev
    --optimize-autoloader
    --no-interaction
  args:
    chdir: "{{ deploy_path }}"
  become_user: "{{ app_name }}"
  environment:
    HOME: "{{ app_home }}"
    COMPOSER_HOME: "{{ app_home }}/.composer"
    COMPOSER_ALLOW_SUPERUSER: "0"
  register: composer_out
  ignore_errors: yes

- name: "PHP | composer result"
  debug:
    msg: "{{ (composer_out.stdout_lines | default([]))[-5:] }}"

- name: "PHP | .env.example exists?"
  stat:
    path: "{{ deploy_path }}/.env.example"
  register: env_example_stat

- name: "PHP | .env exists?"
  stat:
    path: "{{ deploy_path }}/.env"
  register: env_stat

- name: "PHP | .env create from .env.example (agar missing ho)"
  copy:
    src: "{{ deploy_path }}/.env.example"
    dest: "{{ deploy_path }}/.env"
    remote_src: true
    owner: "{{ app_name }}"
    group: www-data
    mode: "0664"
  when:
    - env_example_stat.stat.exists
    - not env_stat.stat.exists

- name: "PHP | artisan key:generate (Fresh only)"
  command: /usr/bin/php artisan key:generate --force
  args:
    chdir: "{{ deploy_path }}"
  become_user: "{{ app_name }}"
  environment:
    HOME: "{{ app_home }}"
  when:
    - deploy_mode == "1"
    - env_stat.stat.exists or env_example_stat.stat.exists
  register: key_out

- name: "PHP | key:generate result"
  debug:
    msg: "{{ key_out.stdout | default('key:generate skipped') }}"
  when:
    - deploy_mode == "1"

# Required order: 1) Import dump (tasks/09_database_restore.yml) → 2) this task (after .env in 10).
- name: "PHP | artisan migrate --force"
  command: /usr/bin/php artisan migrate --force
  args:
    chdir: "{{ deploy_path }}"
  become_user: "{{ app_name }}"
  environment:
    HOME: "{{ app_home }}"
  register: migrate_out
  ignore_errors: yes

- name: "PHP | migrate result"
  debug:
    msg: "{{ migrate_out.stdout_lines | default(['migrate skipped']) }}"

- name: "PHP | artisan storage:link"
  command: /usr/bin/php artisan storage:link --force
  args:
    chdir: "{{ deploy_path }}"
  become_user: "{{ app_name }}"
  environment:
    HOME: "{{ app_home }}"
  ignore_errors: yes

- name: "PHP | Cache clear"
  shell: |
    /usr/bin/php artisan config:clear
    /usr/bin/php artisan route:clear
    /usr/bin/php artisan view:clear
    /usr/bin/php artisan cache:clear || true
  args:
    chdir: "{{ deploy_path }}"
  become_user: "{{ app_name }}"
  environment:
    HOME: "{{ app_home }}"
  ignore_errors: yes

- name: "PHP | Cache optimize"
  shell: |
    /usr/bin/php artisan config:cache
    /usr/bin/php artisan route:cache
    /usr/bin/php artisan view:cache
  args:
    chdir: "{{ deploy_path }}"
  become_user: "{{ app_name }}"
  environment:
    HOME: "{{ app_home }}"
  ignore_errors: yes
