---
# Pre-fetch SQL dump from remote_sql_source_host (inventory / group_vars) to the
# controller, then set sql_dump_path so 09_database_restore.yml can copy to target.
# Included from master_deploy.yml only when sql_dump_path is none/auto and take_dump != yes.

- name: "Prefetch | rsync remote dump → controller"
  block:
    - name: "Prefetch | Remote source SSH reachable"
      wait_for:
        host: "{{ remote_sql_source_host }}"
        port: 22
        timeout: 15
        msg: "Prefetch | {{ remote_sql_source_host }} port 22 not reachable"
      delegate_to: localhost
      become: false

    - name: "Prefetch | rsync {{ remote_sql_source_path }} → /tmp/{{ app_name }}_prefetch.sql"
      shell: |
        rsync -avz \
          -e "ssh -o StrictHostKeyChecking=no -i {{ remote_sql_source_key }}" \
          "{{ remote_sql_source_user }}@{{ remote_sql_source_host }}:{{ remote_sql_source_path }}" \
          "/tmp/{{ app_name }}_prefetch.sql"
      delegate_to: localhost
      become: false
      register: prefetch_rsync

    - name: "Prefetch | sql_dump_path = controller local file"
      set_fact:
        sql_dump_path: "/tmp/{{ app_name }}_prefetch.sql"
      when: prefetch_rsync.rc == 0

    - name: "Prefetch | done"
      debug:
        msg: "Prefetch | sql_dump_path set to {{ sql_dump_path }} (controller)"
      when: sql_dump_path is defined

  rescue:
    - name: "Prefetch | failed"
      fail:
        msg: |
          Remote SQL prefetch failed. Check:
            - remote_sql_source_host / remote_sql_source_path
            - SSH key remote_sql_source_key
            - File exists on source at {{ remote_sql_source_path | default('(unset)') }}
