---
# Task 09: Database create aur SQL import (Fresh Recovery, Golden Copy)
#
# - Create DB & User
# - Restore directly from /tmp/{{ app_name }}_restore.sql

- name: "DB | '{{ db_name }}' create"
  mysql_db:
    name: "{{ db_name }}"
    state: present
    login_unix_socket: "{{ mysql_login_unix_socket }}"
    encoding: utf8mb4
    collation: utf8mb4_unicode_ci

- name: "DB | '{{ db_user }}' user create (all hosts)"
  mysql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    host: "%"
    priv: "{{ db_name }}.*:ALL"
    state: present
    login_unix_socket: "{{ mysql_login_unix_socket }}"
  no_log: true

- name: "DB | localhost access"
  mysql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    host: "localhost"
    priv: "{{ db_name }}.*:ALL"
    state: present
    login_unix_socket: "{{ mysql_login_unix_socket }}"
  no_log: true

- name: "DB | FLUSH PRIVILEGES"
  mysql_query:
    login_unix_socket: "{{ mysql_login_unix_socket }}"
    query: "FLUSH PRIVILEGES"

- name: "DB | Stat restore file on target"
  stat:
    path: "/tmp/{{ app_name }}_restore.sql"
  register: dump_stat_target

- name: "DB | Import SQL (Golden Copy)"
  shell: |
    set -euo pipefail
    mysql --socket="{{ mysql_login_unix_socket }}" -u root "{{ db_name }}" < "/tmp/{{ app_name }}_restore.sql"
  when:
    - dump_stat_target.stat.exists | default(false)

- name: "DB | Mark SQL import completed"
  set_fact:
    sql_import_completed: true
  when: dump_stat_target.stat.exists | default(false)

- name: "DB | Temp SQL file clean"
  file:
    path: "/tmp/{{ app_name }}_restore.sql"
    state: absent
  when:
    - dump_stat_target.stat.exists | default(false)
    - sql_cleanup_after_import | bool

- name: "DB | Summary"
  debug:
    msg:
      - "Database : {{ db_name }} ensured"
      - "DB User  : {{ db_user }} ensured"
      - "Import   : {{ 'Done' if (dump_stat_target.stat.exists | default(false)) else 'Skipped (no dump file)' }}"
