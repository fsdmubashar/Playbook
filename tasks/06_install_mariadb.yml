---
# Task 06: MariaDB install aur configure
# Runs: Fresh Recovery only

- name: "MariaDB | Install"
  apt:
    name:
      - mariadb-server
      - mariadb-client
      - python3-pymysql
    state: present
    update_cache: yes

- name: "MariaDB | Service start aur enable"
  service:
    name: mariadb
    state: started
    enabled: yes

- name: "MariaDB | Anonymous users remove"
  mysql_user:
    name: ''
    host_all: yes
    state: absent
    login_unix_socket: /var/run/mysqld/mysqld.sock
  ignore_errors: yes

- name: "MariaDB | Test database remove"
  mysql_db:
    name: test
    state: absent
    login_unix_socket: /var/run/mysqld/mysqld.sock
  ignore_errors: yes

- name: "MariaDB | Config backup"
  copy:
    src: /etc/mysql/mariadb.conf.d/50-server.cnf
    dest: "/etc/mysql/mariadb.conf.d/50-server.cnf.bak_{{ ansible_date_time.date }}"
    remote_src: yes
    force: no

- name: "MariaDB | Optimized config deploy"
  copy:
    dest: /etc/mysql/mariadb.conf.d/50-server.cnf
    mode: "0644"
    content: |
      [client]
      port   = 3306
      socket = /var/run/mysqld/mysqld.sock

      [mysqld]
      user                     = mysql
      pid-file                 = /var/run/mysqld/mysqld.pid
      socket                   = /var/run/mysqld/mysqld.sock
      port                     = 3306
      basedir                  = /usr
      datadir                  = /var/lib/mysql
      tmpdir                   = /tmp
      bind-address             = 127.0.0.1
      skip-external-locking

      slow_query_log           = 1
      slow_query_log_file      = /var/log/mysql/slow-query.log
      long_query_time          = 5

      key_buffer_size          = 64M
      max_allowed_packet       = 128M
      thread_cache_size        = 30
      max_connections          = 500
      table_open_cache         = 2048
      wait_timeout             = 600
      query_cache_limit        = 2M
      query_cache_size         = 64M

      innodb_buffer_pool_size  = {{ (ansible_memtotal_mb * 0.6) | int }}M
      innodb_flush_method      = O_DIRECT
      innodb_lock_wait_timeout = 240
      innodb_file_per_table

      expire_logs_days         = 10
      max_binlog_size          = 100M

      [mysqldump]
      quick
      quote-names
      max_allowed_packet = 128M
  notify: restart mariadb
