---
# Task 05: Node.js install
# Runs: Fresh Recovery + stack_type == nodejs

- name: "NodeJS | NodeSource LTS repo add"
  shell: curl -fsSL https://deb.nodesource.com/setup_lts.x | bash -
  args:
    creates: /etc/apt/sources.list.d/nodesource.list

- name: "NodeJS | Node.js install"
  apt:
    name: nodejs
    state: present
    update_cache: yes

- name: "NodeJS | PM2 globally install"
  npm:
    name: pm2
    global: yes
    state: present

- name: "NodeJS | Version verify"
  command: node --version
  register: node_ver
  changed_when: false

- name: "NodeJS | Version display"
  debug:
    msg: "Node.js: {{ node_ver.stdout }}"
