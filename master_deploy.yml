---
# =============================================================================
# PHP/LARAVEL APPLICATION DEPLOYMENT & RECOVERY TOOL
# Version : 5.0 (PHP Only)
# Run From: LOCAL THINKPAD only - NEVER from target server
# Usage   : ansible-playbook -i inventory.ini master_deploy.yml --limit <IP> --step
# =============================================================================

- name: "PHP/Laravel App Deployment"
  hosts: all
  become: yes
  gather_facts: no

  # ============================================================
  # VARS_PROMPT
  # RULE: default values mein {{ variable }} use BILKUL NAHI karna
  # ============================================================
  vars_prompt:

    - name: execution_context
      prompt: |

        ╔══════════════════════════════════════════╗
        ║   PHP DEPLOYMENT TOOL v5.0               ║
        ╚══════════════════════════════════════════╝
        Target Server:
          [localhost] - Is hi server par chal raha hai
          [remote]    - Kisi aur server par deploy karna hai
        Choice
      private: no
      default: "remote"

    - name: deploy_mode
      prompt: |

        Deployment Mode:
          [1] Fresh Recovery  - Naya server / naya deployment
          [2] Re-configure    - Existing server update / live crash fix
        Choice
      private: no
      default: "1"

    - name: app_name
      prompt: |

        App Name (lowercase, underscore format)
        Yahi Linux user banta hai
        Example: laravel_app
        App Name
      private: no

    - name: app_domain
      prompt: |

        App Domain ya IP Address:
          Domain → laravel.example.com  (SSL lagega)
          IP     → 64.227.161.61        (SSL nahi lagega)
        Value
      private: no

    - name: ssl_choice
      prompt: |

        SSL/HTTPS add karna hai?
          [no]  - Port 80 only (no 443)
          [yes] - LetsEncrypt SSL (sirf domain ho to)
        Choice
      private: no
      default: "no"

    - name: deploy_path
      prompt: "Deployment Path (e.g., /var/www/html/laravel_app)"
      private: no
      default: "/var/www/html/myapp"

    - name: php_version
      prompt: "PHP Version (default: 8.2)"
      private: no
      default: "8.2"

    - name: source_type
      prompt: |

        Code Source:
          [git]   - GitHub / Bitbucket se clone
          [rsync] - Remote server se copy
        Source
      private: no
      default: "git"

    - name: git_url
      prompt: "Git Repository URL (e.g., git@bitbucket.org:org/repo.git)"
      private: no
      default: "none"

    - name: git_branch
      prompt: "Git Branch (e.g., main / master / production)"
      private: no
      default: "main"
      
    - name: git_ssh_key
      prompt: "SSH Key for Git (Bitbucket/GitHub private repos)"
      private: no
      default: "~/.ssh/id_rsa"

    - name: rsync_source
      prompt: "rsync Source (user@host:/path/to/app) - rsync mode ke liye"
      private: no
      default: "none"

    - name: db_name
      prompt: "Database Name"
      private: no

    - name: db_user
      prompt: "Database Username"
      private: no

    - name: db_password
      prompt: "Database Password (hidden)"
      private: yes

    - name: restore_db
      prompt: |
      
        Purane server ki application DB ka dump (Golden Copy) restore karna hai?
          [no]  - Nahi (fresh deploy, koi import nahi)
          [yes] - Haan (backup server se DB fetch hogi aur import hogi)
        Choice
      private: no
      default: "no"

    - name: redis_host
      prompt: "Redis Host"
      private: no
      default: "127.0.0.1"

    - name: redis_port
      prompt: "Redis Port"
      private: no
      default: "6379"

    - name: php_pm_max_children
      prompt: "PHP-FPM pm.max_children (default: 50)"
      private: no
      default: "50"

  # ============================================================
  # COMPUTED VARIABLES
  # ============================================================
  vars:
    enable_ssl: "{{ ssl_choice == 'yes' }}"
    is_fresh:     "{{ deploy_mode == '1' }}"
    is_reconfig:  "{{ deploy_mode == '2' }}"
    is_git:       "{{ source_type == 'git' }}"
    is_rsync:     "{{ source_type == 'rsync' }}"

    # Domain vs IP auto-detect
    is_domain: "{{ not (app_domain | regex_search('^[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}$')) }}"

    # SSL label
    ssl_label: "{{ 'LetsEncrypt-domain' if (is_domain | bool and enable_ssl | bool) else 'SSL disabled (port 80 only)' }}"

    # Let's Encrypt cert paths
    le_cert_path: "/etc/letsencrypt/live/{{ app_domain }}/fullchain.pem"
    le_key_path:  "/etc/letsencrypt/live/{{ app_domain }}/privkey.pem"

    # PHP-FPM paths
    php_fpm_socket: "/run/php/php{{ php_version }}-fpm-{{ app_name }}.sock"
    php_pool_conf:  "/etc/php/{{ php_version }}/fpm/pool.d/{{ app_name }}.conf"

    # Nginx paths
    nginx_available: "/etc/nginx/sites-available/{{ app_name }}"
    nginx_enabled:   "/etc/nginx/sites-enabled/{{ app_name }}"

    # App paths
    app_home:    "/home/{{ app_name }}"
    app_log_dir: "/var/log/apps/{{ app_name }}"

    # PHP-FPM pool calculated values
    php_pm_start_servers: "{{ [(php_pm_max_children | int / 4) | int, 5] | max }}"
    php_pm_min_spare:     "{{ [(php_pm_max_children | int / 5) | int, 5] | max }}"
    php_pm_max_spare:     "{{ [(php_pm_max_children | int / 2) | int, 10] | max }}"

  # ============================================================
  # HANDLERS
  # ============================================================
  handlers:
    - name: reload nginx
      service:
        name: nginx
        state: reloaded

    - name: restart php-fpm
      service:
        name: "php{{ php_version }}-fpm"
        state: restarted

    - name: restart mariadb
      service:
        name: mariadb
        state: restarted

  # ============================================================
  # PRE-TASKS
  # ============================================================
  pre_tasks:
    - name: "Gather minimal facts (memory, CPU only)"
      setup:
        gather_subset:
          - hardware
          - date_time
      tags: [always]

    - name: "Deployment Summary"
      debug:
        msg:
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - " MODE    : {{ 'FRESH RECOVERY' if deploy_mode == '1' else 'RE-CONFIGURE' }}"
          - " APP     : {{ app_name }}"
          - " DOMAIN  : {{ app_domain }}"
          - " SSL     : {{ ssl_label }}"
          - " PATH    : {{ deploy_path }}"
          - " STACK   : PHP"
          - " SOURCE  : {{ source_type | upper }}"
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

    - name: "Log directory create karo"
      file:
        path: "{{ app_log_dir }}"
        state: directory
        mode: "0755"

    - name: "[PRE] Fetch Golden Copy DB dump from Backup Server"
      include_tasks: tasks/prefetch_golden_copy.yml
      when:
        - deploy_mode == "1"
        - restore_db == "yes"
        - backup_server_host is defined
        - backup_server_host | length > 0
      tags: [db-fetch]

  # ============================================================
  # MAIN TASKS FLOW
  # ============================================================
  tasks:

    # ── PHASE 1: FRESH - Stack Installation ──────────────────
    - name: "[1/7] FRESH | System preparation"
      include_tasks: tasks/01_system_prep.yml
      when: deploy_mode == "1"
      tags: [fresh, system-prep]

    - name: "[2/7] FRESH | Nginx install aur global config"
      include_tasks: tasks/02_install_nginx.yml
      when: deploy_mode == "1"
      tags: [fresh, nginx-install]

    - name: "[3/7] FRESH | PHP Stack install"
      include_tasks: tasks/03_install_php.yml
      when: deploy_mode == "1"
      tags: [fresh, php-install]

    - name: "[4/7] FRESH | MariaDB install aur configure"
      include_tasks: tasks/06_install_mariadb.yml
      when: deploy_mode == "1"
      tags: [fresh, db-setup]

    - name: "[4/7] FRESH | Redis install aur configure"
      include_tasks: tasks/06b_install_redis.yml
      when: deploy_mode == "1"
      tags: [fresh, redis-install]

    # ── PHASE 2: App User, Code, DB, Env ─────────────────────
    - name: "[5/7] ALL | App Linux user create karo"
      include_tasks: tasks/07_app_user.yml
      tags: [always, app-user]

    - name: "[5/7] ALL | Code deploy karo"
      include_tasks: tasks/08_code_deploy.yml
      tags: [always, code-deploy, git-pull]

    - name: "[5/7] FRESH | Database create aur restore"
      include_tasks: tasks/09_database_restore.yml
      when: deploy_mode == "1"
      tags: [fresh, db-restore]

    - name: "[6/7] ALL | .env configure karo"
      include_tasks: tasks/10_env_config.yml
      tags: [always, env-config]

    # ── PHASE 3: Services ─────────────────────────────────────
    - name: "[6/7] PHP | FPM pool configure karo"
      include_tasks: tasks/11_fpm_pool.yml
      tags: [always, fpm-pool]

    - name: "[6/7] ALL | SSL - domain hai to LetsEncrypt"
      include_tasks: tasks/13b_ssl_certbot.yml
      when:
        - enable_ssl | bool
        - is_domain | bool
      tags: [always, ssl]

    - name: "[6/7] ALL | Nginx vhost configure karo"
      include_tasks: tasks/13_nginx_config.yml
      tags: [always, nginx-config]

    # ── PHASE 4: App Commands aur Verify ──────────────────────
    - name: "[7/7] ALL | App-specific commands chalao"
      include_tasks: tasks/14_app_commands.yml
      tags: [always, app-commands, composer, artisan, migrate]

    - name: "[7/7] ALL | Verify aur Reload services"
      include_tasks: tasks/15_verify_reload.yml
      tags: [always, verify]
