---
# =============================================================================
# PHP/LARAVEL APPLICATION DEPLOYMENT & RECOVERY TOOL
# Version : 5.1 (Prompt & Auto-Optimiztion Refined)
# Usage   : ansible-playbook -i inventory.ini master_deploy.yml --limit <IP>
# =============================================================================

- name: "PHP/Laravel App Deployment"
  hosts: all
  become: yes
  gather_facts: no
  strategy: linear

  # ============================================================
  # HANDLERS
  # ============================================================
  handlers:
    - name: reload nginx
      service:
        name: nginx
        state: reloaded

    - name: restart php-fpm
      service:
        name: "php{{ php_version }}-fpm"
        state: restarted

    - name: restart mariadb
      service:
        name: mariadb
        state: restarted

  # ============================================================
  # PRE-TASKS (PROMPTS AND FACT GATHERING)
  # ============================================================
  pre_tasks:
    - name: "System | Gather minimal facts (memory, OS)"
      setup:
        gather_subset:
          - hardware
          - date_time
      tags: [always]

    - name: "Prompt | Execute Interactive Mode?"
      debug:
        msg: "Interactive variables collection starting. Pass -e 'var=value' to skip prompts."
      tags: [always]

    # 1. deploy_mode
    - name: "Prompt | deploy_mode"
      pause:
        prompt: "Deployment Mode: [1] Fresh Recovery  [2] Re-configure\nChoice [1]"
      register: prompt_deploy_mode
      when: deploy_mode is not defined
      run_once: true
      delegate_to: localhost



    - name: "Set | deploy_mode"
      set_fact:
        deploy_mode: "{{ deploy_mode | default(prompt_deploy_mode.user_input | default('1', true), true) }}"

    # 2. app_name
    - name: "Prompt | app_name"
      pause:
        prompt: "App Name (lowercase, underscore format - e.g., laravel_app)"
      register: prompt_app_name
      when: app_name is not defined
      run_once: true
      delegate_to: localhost



    - name: "Set | app_name"
      set_fact:
        app_name: "{{ app_name | default(prompt_app_name.user_input, true) }}"
      failed_when: app_name | length == 0

    # 3. app_domain
    - name: "Prompt | app_domain"
      pause:
        prompt: "App Domain or IP Address (e.g., example.com or 1.1.1.1)"
      register: prompt_app_domain
      when: app_domain is not defined
      run_once: true
      delegate_to: localhost



    - name: "Set | app_domain"
      set_fact:
        app_domain: "{{ app_domain | default(prompt_app_domain.user_input, true) }}"
      failed_when: app_domain | length == 0

    # 4. ssl_choice
    - name: "Prompt | ssl_choice"
      pause:
        prompt: "Enable LetsEncrypt SSL? (domain only) [yes/no]\nChoice [no]"
      register: prompt_ssl_choice
      when: ssl_choice is not defined
      run_once: true
      delegate_to: localhost



    - name: "Set | ssl_choice"
      set_fact:
        ssl_choice: "{{ ssl_choice | default(prompt_ssl_choice.user_input | default('no', true), true) }}"

    # 5. deploy_path
    - name: "Prompt | deploy_path"
      pause:
        prompt: "Deployment Path (e.g., /var/www/html/{{ app_name }})\nPath [/var/www/html/{{ app_name }}]"
      register: prompt_deploy_path
      when: deploy_path is not defined
      run_once: true
      delegate_to: localhost



    - name: "Set | deploy_path"
      set_fact:
        deploy_path: "{{ deploy_path | default(prompt_deploy_path.user_input | default('/var/www/html/' ~ app_name, true), true) }}"

    # 6. php_version
    - name: "Prompt | php_version"
      pause:
        prompt: "PHP Version\nVersion [8.2]"
      register: prompt_php_version
      when: php_version is not defined
      run_once: true
      delegate_to: localhost



    - name: "Set | php_version"
      set_fact:
        php_version: "{{ php_version | default(prompt_php_version.user_input | default('8.2', true), true) }}"

    # 7. source_type
    - name: "Prompt | source_type"
      pause:
        prompt: "Code Source: [git] (GitHub/Bitbucket) or [rsync] (Copy from another server)\nSource [git]"
      register: prompt_source_type
      when: source_type is not defined
      run_once: true
      delegate_to: localhost



    - name: "Set | source_type"
      set_fact:
        source_type: "{{ source_type | default(prompt_source_type.user_input | default('git', true), true) }}"

    # 8. Git vs Rsync Conditionals
    - name: "Prompt | git_url"
      pause:
        prompt: "Git Repository URL (e.g., git@github.com:org/repo.git)"
      register: prompt_git_url
      when: 
        - git_url is not defined
        - source_type == 'git'
      run_once: true
      delegate_to: localhost



    - name: "Set | git_url"
      set_fact:
        git_url: "{{ git_url | default(prompt_git_url.user_input | default('none', true), true) }}"
      when: source_type == 'git'

    - name: "Prompt | git_branch"
      pause:
        prompt: "Git Branch\nBranch [main]"
      register: prompt_git_branch
      when: 
        - git_branch is not defined
        - source_type == 'git'
      run_once: true
      delegate_to: localhost



    - name: "Set | git_branch"
      set_fact:
        git_branch: "{{ git_branch | default(prompt_git_branch.user_input | default('main', true), true) }}"
      when: source_type == 'git'

    - name: "Prompt | git_key_configured"
      pause:
        prompt: "Is the Git SSH Deploy Key already configured on this server? [yes/no]\nChoice [no]"
      register: prompt_key_configured
      when: 
        - git_ssh_key is not defined
        - source_type == 'git'
      run_once: true
      delegate_to: localhost



    - name: "Prompt | git_ssh_key"
      pause:
        prompt: "Provide the Private Key path (e.g., ~/.ssh/id_rsa). Press enter to abort.\nPath"
      register: prompt_git_ssh_key
      when:
        - git_ssh_key is not defined
        - source_type == 'git'
        - prompt_key_configured.user_input | default('no', true) != 'yes'
      run_once: true
      delegate_to: localhost



    - name: "Set | git_ssh_key"
      set_fact:
        git_ssh_key: "{{ git_ssh_key | default(prompt_git_ssh_key.user_input | default('', true), true) }}"
      when: 
        - source_type == 'git'
        - prompt_key_configured.user_input | default('no', true) != 'yes'

    - name: "Fail | No SSH Key provided"
      fail:
        msg: "Deployment aborted: No SSH key provided for private repository access."
      when: 
        - source_type == 'git'
        - prompt_key_configured.user_input | default('no', true) != 'yes'
        - git_ssh_key | length == 0

    - name: "Prompt | rsync_source"
      pause:
        prompt: "Rsync Source (e.g., user@host:/path/to/app)"
      register: prompt_rsync_source
      when: 
        - rsync_source is not defined
        - source_type == 'rsync'
      run_once: true
      delegate_to: localhost



    - name: "Set | rsync_source"
      set_fact:
        rsync_source: "{{ rsync_source | default(prompt_rsync_source.user_input | default('none', true), true) }}"
      when: source_type == 'rsync'

    # 9. Database Info
    - name: "Prompt | db_name"
      pause:
        prompt: "Database Name"
      register: prompt_db_name
      when: db_name is not defined
      run_once: true
      delegate_to: localhost



    - name: "Set | db_name"
      set_fact:
        db_name: "{{ db_name | default(prompt_db_name.user_input, true) }}"
      failed_when: db_name | length == 0

    - name: "Prompt | db_user"
      pause:
        prompt: "Database Username"
      register: prompt_db_user
      when: db_user is not defined
      run_once: true
      delegate_to: localhost



    - name: "Set | db_user"
      set_fact:
        db_user: "{{ db_user | default(prompt_db_user.user_input, true) }}"
      failed_when: db_user | length == 0

    - name: "Prompt | db_password"
      pause:
        prompt: "Database Password"
        echo: no
      register: prompt_db_password
      when: db_password is not defined
      run_once: true
      delegate_to: localhost



    - name: "Set | db_password"
      set_fact:
        db_password: "{{ db_password | default(prompt_db_password.user_input, true) }}"

    - name: "Prompt | restore_db"
      pause:
        prompt: "Restore Golden Copy DB from Backup Server? [yes/no]\nChoice [no]"
      register: prompt_restore_db
      when: restore_db is not defined and deploy_mode == '1'
      run_once: true
      delegate_to: localhost



    - name: "Set | restore_db"
      set_fact:
        restore_db: "{{ restore_db | default(prompt_restore_db.user_input | default('no', true), true) }}"
      when: deploy_mode == '1'

    # 10. Computed Real-Time Variables
    - name: "Compute | Global Facts"
      set_fact:
        enable_ssl: "{{ ssl_choice == 'yes' }}"
        is_fresh: "{{ deploy_mode == '1' }}"
        is_reconfig: "{{ deploy_mode == '2' }}"
        is_git: "{{ source_type == 'git' }}"
        is_rsync: "{{ source_type == 'rsync' }}"
        is_domain: "{{ not (app_domain | regex_search('^[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}$')) }}"

    - name: "Compute | Path Facts"
      set_fact:
        ssl_label: "{{ 'LetsEncrypt-domain' if (is_domain | bool and enable_ssl | bool) else 'SSL disabled (port 80 only)' }}"
        le_cert_path: "/etc/letsencrypt/live/{{ app_domain }}/fullchain.pem"
        le_key_path: "/etc/letsencrypt/live/{{ app_domain }}/privkey.pem"
        php_fpm_socket: "/run/php/php{{ php_version }}-fpm-{{ app_name }}.sock"
        php_pool_conf: "/etc/php/{{ php_version }}/fpm/pool.d/{{ app_name }}.conf"
        nginx_available: "/etc/nginx/sites-available/{{ app_name }}"
        nginx_enabled: "/etc/nginx/sites-enabled/{{ app_name }}"
        app_home: "/home/{{ app_name }}"
        app_log_dir: "/var/log/apps/{{ app_name }}"

    - name: "Deployment Summary"
      debug:
        msg:
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - " MODE    : {{ 'FRESH RECOVERY' if deploy_mode == '1' else 'RE-CONFIGURE' }}"
          - " APP     : {{ app_name }}"
          - " DOMAIN  : {{ app_domain }}"
          - " SSL     : {{ ssl_label }}"
          - " PATH    : {{ deploy_path }}"
          - " STACK   : {{ stack_type | upper }}"
          - " SOURCE  : {{ source_type | upper }}"
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

    - name: "Log directory create karo"
      file:
        path: "{{ app_log_dir }}"
        state: directory
        mode: "0755"

    - name: "[PRE] Fetch Golden Copy DB dump from Backup Server"
      include_tasks: tasks/prefetch_golden_copy.yml
      when:
        - deploy_mode == "1"
        - restore_db == "yes"
        - backup_server_host is defined
        - backup_server_host | length > 0
      tags: [db-fetch]

  # ============================================================
  # MAIN TASKS FLOW
  # ============================================================
  tasks:

    # ── PHASE 1: FRESH - Stack Installation ──────────────────
    - name: "[1/7] FRESH | System preparation"
      include_tasks: tasks/01_system_prep.yml
      when: deploy_mode == "1"
      tags: [fresh, system-prep]

    - name: "[2/7] FRESH | Nginx install aur global config"
      include_tasks: tasks/02_install_nginx.yml
      when: deploy_mode == "1"
      tags: [fresh, nginx-install]

    - name: "[3/7] FRESH | PHP Stack install"
      include_tasks: tasks/03_install_php.yml
      when: deploy_mode == "1"
      tags: [fresh, php-install]

    - name: "[4/7] FRESH | MariaDB install aur configure"
      include_tasks: tasks/06_install_mariadb.yml
      when: deploy_mode == "1"
      tags: [fresh, db-setup]

    - name: "[4/7] FRESH | Redis install aur configure"
      include_tasks: tasks/06b_install_redis.yml
      when: deploy_mode == "1"
      tags: [fresh, redis-install]

    # ── PHASE 2: App User, Code, DB, Env ─────────────────────
    - name: "[5/7] ALL | App Linux user create karo"
      include_tasks: tasks/07_app_user.yml
      tags: [always, app-user]

    - name: "[5/7] ALL | Code deploy karo"
      include_tasks: tasks/08_code_deploy.yml
      tags: [always, code-deploy, git-pull]

    - name: "[5/7] FRESH | Database create aur restore"
      include_tasks: tasks/09_database_restore.yml
      when: deploy_mode == "1"
      tags: [fresh, db-restore]

    - name: "[6/7] ALL | .env configure karo"
      include_tasks: tasks/10_env_config.yml
      tags: [always, env-config]

    # ── PHASE 3: Services ─────────────────────────────────────
    - name: "[6/7] PHP | FPM pool configure karo"
      include_tasks: tasks/11_fpm_pool.yml
      tags: [always, fpm-pool]

    - name: "[6/7] ALL | SSL - domain hai to LetsEncrypt"
      include_tasks: tasks/13b_ssl_certbot.yml
      when:
        - enable_ssl | bool
        - is_domain | bool
      tags: [always, ssl]

    - name: "[6/7] ALL | Nginx vhost configure karo"
      include_tasks: tasks/13_nginx_config.yml
      tags: [always, nginx-config]

    # ── PHASE 4: App Commands aur Verify ──────────────────────
    - name: "[7/7] ALL | App-specific commands chalao"
      include_tasks: tasks/14_app_commands.yml
      tags: [always, app-commands, composer, artisan, migrate]

    - name: "[7/7] ALL | Verify aur Reload services"
      include_tasks: tasks/15_verify_reload.yml
      tags: [always, verify]
